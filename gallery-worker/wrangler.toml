name = "gallery-worker"
main = "src/index.ts"
compatibility_date = "2025-04-19"

[[r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "photos" 

[vars]
ALLOWED_ORIGIN = "https://jordiop.es"

# Local development — run with: wrangler dev
[env.dev.vars]
ALLOWED_ORIGIN = "*"

[[env.dev.r2_buckets]]
binding = "PHOTOS_BUCKET"
bucket_name = "photos"
